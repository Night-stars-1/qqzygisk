name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: webroot/pnpm-lock.yaml

      - name: Grant Gradle
        run: chmod +x gradlew

      - name: Assemble release module
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify module contains Web UI
        run: |
          python3 - <<'PY'
          import re
          import sys
          import zipfile

          path = "app/build/outputs/magisk/release/qqhook.zip"
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              index_name = "webroot/index.html"
              if index_name not in names:
                  sys.exit(f"模块 ZIP 缺少 {index_name}")
              html = archive.read(index_name).decode("utf-8")
              refs = [
                  ref
                  for ref in re.findall(r"""(?:src|href)\s*=\s*["']([^"']+)["']""", html)
                  if ref.endswith((".js", ".css"))
                  and not ref.startswith(("http://", "https://", "//", "data:"))
              ]
              if not refs:
                  sys.exit(f"{index_name} 未引用任何本地 JS/CSS")
              for ref in refs:
                  entry = "webroot/" + ref.split("?", 1)[0].split("#", 1)[0].lstrip("/").removeprefix("./")
                  if entry not in names:
                      sys.exit(f"模块 ZIP 缺少 {entry}")
                  if archive.getinfo(entry).file_size == 0:
                      sys.exit(f"模块 ZIP 中的 {entry} 为空")
              print(f"Web UI 校验通过：{index_name}，引用 {len(refs)} 个 JS/CSS 资源")
          PY

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: qqhook
          path: app/build/outputs/magisk/release/qqhook.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download module zip
        uses: actions/download-artifact@v4
        with:
          name: qqhook
          path: dist

      - name: Write update.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version_name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          cat > dist/update.json <<EOF
          {
            "version": "${version_name:-$TAG}",
            "versionCode": ${version_code:-0},
            "zipUrl": "https://github.com/${REPO}/releases/download/${TAG}/qqhook.zip",
            "changelog": "https://raw.githubusercontent.com/${REPO}/${TAG}/changelog.md"
          }
          EOF
          cp changelog.md dist/changelog.md
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("changelog.md").read_text(encoding="utf-8").splitlines()
          notes = []
          for line in lines[1:]:
              if line.startswith("# "):
                  break
              notes.append(line)
          Path("dist/release-notes.md").write_text("\n".join(notes).strip() + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: qqhook ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: dist/release-notes.md
          files: |
            dist/qqhook.zip
            dist/update.json
            dist/changelog.md
          fail_on_unmatched_files: true
